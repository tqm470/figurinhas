name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Optional: add these repository secrets so every CI build is signed with your key
      # (then new APKs install over old ones without losing your packs).
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Figurinhas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Figurinhas-apk
          path: Figurinhas.apk

      # Push a tag like v1.0.1 to publish a GitHub Release you can download straight from your phone.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Figurinhas.apk
          generate_release_notes: true

      # Every push to a branch (and manual runs) also publishes a test build to the
      # Releases page, so the APK can be downloaded from a phone without unzipping artifacts.
      - name: Publish test build
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ github.run_number }} (${{ github.ref_name }})
          body: Automatic build of ${{ github.sha }}. Download Figurinhas.apk below and open it on your phone.
          prerelease: true
          files: Figurinhas.apk
